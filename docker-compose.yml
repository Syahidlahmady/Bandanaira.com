services:
  db:
    image: postgis/postgis:16-3.4
    container_name: banda_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-banda_digital}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-banda_digital}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: banda_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongoadmin}
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banda_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8005}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-banda_digital}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-banda_digital}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}:${MONGO_INITDB_ROOT_PASSWORD:-mongoadmin}@mongodb:27017/banda_surveys?authSource=admin
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5175,http://localhost:5173,http://localhost:3000}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-BandaNeiraIslandEcoSecretKey2026}
      HMAC_BLIND_INDEX_PEPPER: ${HMAC_BLIND_INDEX_PEPPER:-PepperBandaNeiraCitizen2026MasterSalt}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banda_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5175}:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8005/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
