<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description"
    content="Ekosistem Digital Banda Neira - Administrasi Kependudukan, Pemetaan Lahan Rempah, dan Traceability Rantai Pasok Berbasis Blockchain & PWA Offline." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload responsive LCP hero image for instant discovery -->
  <link rel="preload" href="/banda.webp" imagesrcset="/banda-480.webp 480w, /banda-960.webp 960w, /banda-1440.webp 1440w, /banda.webp 1920w" imagesizes="(max-width: 1024px) 100vw, 1920px" as="image" type="image/webp" fetchpriority="high" />

  <!-- Fast, preconnected font loading with font-display: swap -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Style+Script&display=swap" />

  <title>Visit Banda Naira : Official Banda Naira Website</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .critical-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100dvh;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .critical-hero__frame {
      position: absolute;
      inset: 0;
      clip-path: inset(21% 28% 21% 28% round 24px);
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
    }
    @media (max-width: 1023px) {
      .critical-hero__frame {
        clip-path: inset(24% 15% 24% 15% round 18px);
      }
    }
    .critical-hero__media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .critical-hero__title {
      position: relative;
      z-index: 10;
      color: #fff;
      font-weight: 900;
      font-size: clamp(1.75rem, 5.6vw, 7.5rem);
      text-align: center;
      letter-spacing: -0.035em;
      text-shadow: 0 16px 36px rgba(0,0,0,0.95);
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>

<body style="background-color: #000; margin: 0;">
  <div id="root">
    <div class="critical-hero" aria-hidden="true">
      <div class="critical-hero__frame">
        <img
          class="critical-hero__media"
          src="/banda.webp"
          srcset="/banda-480.webp 480w, /banda-960.webp 960w, /banda-1440.webp 1440w, /banda.webp 1920w"
          sizes="(max-width: 1024px) 100vw, 1920px"
          alt="Pemandangan Banda Neira dari udara dengan laut dan pulau-pulau di sekitarnya"
          width="1920"
          height="1106"
          fetchpriority="high"
          decoding="sync"
        />
      </div>
      <div class="critical-hero__title">
        Di jantung rempah dunia
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
